        required: true
        type: file
      - default: insert
        description: insert or upsert
        enum:
        - insert
        - upsert
        in: query
        name: mode
        type: string
      - default: false
        description: Validate without writing
        in: query
        name: dry_run
        type: boolean
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/importjob.Job'
        "400":
