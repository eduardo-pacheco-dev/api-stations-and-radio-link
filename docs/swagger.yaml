basePath: /api/v1
definitions:
  httpapi.ErrorResponse:
    properties:
      error:
        example: internal_server_error
        type: string
      message:
        example: unexpected internal error
        type: string
    type: object
  httpapi.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  importjob.Entity:
    enum:
    - stations
    - radio_links
    type: string
    x-enum-varnames:
    - EntityStations
    - EntityRadioLinks
  importjob.Error:
    properties:
      key:
        example: TSHG01
        type: string
      message:
        example: invalid latitude "abc"
        type: string
      row:
        example: 2
        type: integer
    type: object
  importjob.Job:
    properties:
      created_at:
        type: string
      dry_run:
        example: false
        type: boolean
      entity:
        allOf:
        - $ref: '#/definitions/importjob.Entity'
        example: stations
      error_message:
        type: string
      errors:
        items:
          $ref: '#/definitions/importjob.Error'
        type: array
      failed_rows:
        example: 500
        type: integer
      file_name:
        example: stations.xlsx
        type: string
      finished_at:
        type: string
      id:
        example: 6f0e6e6e-...
        type: string
      imported_rows:
        example: 100000
        type: integer
      mode:
        example: upsert
        type: string
      processed_rows:
        example: 150000
        type: integer
      started_at:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/importjob.Status'
        example: running
      total_rows:
        example: 700000
        type: integer
      updated_at:
        type: string
      updated_rows:
        example: 49500
        type: integer
      valid_rows:
        example: 149500
        type: integer
    type: object
  importjob.Page:
    properties:
      items:
        items:
          $ref: '#/definitions/importjob.Job'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  importjob.Status:
    enum:
    - pending
    - running
    - completed
    - failed
    - canceled
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusRunning
    - StatusCompleted
    - StatusFailed
    - StatusCanceled
  radiolink.ImportError:
    properties:
      link_id:
        example: RL-0001
        type: string
      message:
        example: link_id is required
        type: string
      row:
        example: 2
        type: integer
    type: object
  radiolink.ImportResult:
    properties:
      dry_run:
        example: false
        type: boolean
      errors:
        items:
          $ref: '#/definitions/radiolink.ImportError'
        type: array
      failed:
        example: 5
        type: integer
      imported:
        example: 90
        type: integer
      total:
        example: 100
        type: integer
      updated:
        example: 5
        type: integer
      valid:
        example: 95
        type: integer
    type: object
  radiolink.Page:
    properties:
      items:
        items:
          $ref: '#/definitions/radiolink.RadioLink'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 1
        type: integer
      total_pages:
        example: 1
        type: integer
    type: object
  radiolink.RadioLink:
    properties:
      capacity_mbps:
        example: 1000
        type: number
      created_at:
        example: "2026-10-24T12:00:00Z"
        type: string
      distance_km:
        example: 420.5
        type: number
      frequency_mhz:
        example: 18000
        type: number
      link_id:
        example: RL-0001
        type: string
      name:
        example: TSHG01 <> CUI13
        type: string
      observation:
        example: Link principal
        type: string
      station_a_site_id:
        example: TSHG01
        type: string
      station_b_site_id:
        example: CUI13
        type: string
      status:
        example: Ativo
        type: string
      technology:
        example: MW
        type: string
      updated_at:
        example: "2026-10-24T12:00:00Z"
        type: string
    type: object
  radiolink.RadioLinkData:
    properties:
      capacity_mbps:
        example: 1000
        type: number
      distance_km:
        example: 420.5
        type: number
      frequency_mhz:
        example: 18000
        type: number
      link_id:
        example: RL-0001
        type: string
      name:
        example: TSHG01 <> CUI13
        type: string
      observation:
        example: Link principal
        type: string
      station_a_site_id:
        example: TSHG01
        type: string
      station_b_site_id:
        example: CUI13
        type: string
      status:
        example: Ativo
        type: string
      technology:
        example: MW
        type: string
    type: object
  station.ImportError:
    properties:
      message:
        example: site_id is required
        type: string
      row:
        example: 2
        type: integer
      site_id:
        example: TSHG01
        type: string
    type: object
  station.ImportResult:
    properties:
      dry_run:
        example: false
        type: boolean
      errors:
        items:
          $ref: '#/definitions/station.ImportError'
        type: array
      failed:
        example: 5
        type: integer
      imported:
        example: 90
        type: integer
      total:
        example: 100
        type: integer
      updated:
        example: 5
        type: integer
      valid:
        example: 95
        type: integer
    type: object
  station.Page:
    properties:
      items:
        items:
          $ref: '#/definitions/station.Station'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 1
        type: integer
      total_pages:
        example: 1
        type: integer
    type: object
  station.Station:
    properties:
      address:
        example: FAZENDA MUNDO NOVO, S/N, ZONA RURAL, TRES RANCHOS
        type: string
      area_holder:
        example: AMERICAN TOWER
        type: string
      city:
        example: TRES RANCHOS
        type: string
      contract_area_type:
