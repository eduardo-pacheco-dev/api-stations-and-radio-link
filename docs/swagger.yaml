        type: number
      latitude:
        example: -18.345528
        type: number
      longitude:
        example: -47.772028
        type: number
      neighborhood:
        example: ZONA RURAL
        type: string
      nominal_aev:
        example: "10"
        type: string
      observation:
        example: VENDIDO GENESIS - 1º CLOSING
        type: string
      regional:
        example: TCO
