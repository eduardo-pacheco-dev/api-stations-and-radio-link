host: localhost:8080
info:
  contact: {}
  description: API for stations and radio link management.
  title: API Stations and Radio Link
  version: "1.0"
paths:
  /healthz:
    get:
      description: Returns 200 when the HTTP server is running, independently of database
        connectivity.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /import-jobs:
    get:
      description: Returns a paginated list of import jobs.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: page_size
        type: integer
      - description: stations or radio_links
        in: query
        name: entity
        type: string
      - description: pending, running, completed, failed or canceled
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/importjob.Page'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: List import jobs
      tags:
      - import-jobs
  /import-jobs/{jobID}:
    get:
      description: Returns the status and progress of an import job.
      parameters:
      - description: Import job ID
        in: path
        name: jobID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/importjob.Job'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get import job
      tags:
      - import-jobs
  /radio-links:
    get:
      description: Returns a paginated list of radio links.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: page_size
        type: integer
      - description: Search by link_id, name, stations or technology
        in: query
        name: search
        type: string
      - description: Filter links where the station is endpoint A or B
        in: query
        name: station_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/radiolink.Page'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: List radio links
      tags:
      - radio-links
    post:
      consumes:
      - application/json
      description: Creates a radio link between two stations (A and B). The link_id
        must be unique.
      parameters:
      - description: Radio link data
        in: body
        name: radioLink
        required: true
        schema:
          $ref: '#/definitions/radiolink.RadioLinkData'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/radiolink.RadioLink'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Create radio link
      tags:
      - radio-links
  /radio-links/{linkID}:
    delete:
      description: Deletes a radio link by link_id.
      parameters:
      - description: Radio link link_id
        in: path
        name: linkID
        required: true
        type: string
      responses:
        "204":
          description: No content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Delete radio link
      tags:
      - radio-links
    get:
      description: Returns a radio link by link_id.
      parameters:
      - description: Radio link link_id
        in: path
        name: linkID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/radiolink.RadioLink'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get radio link
      tags:
      - radio-links
    put:
      consumes:
      - application/json
      description: Updates a radio link by link_id. The link_id cannot be changed.
      parameters:
      - description: Radio link link_id
        in: path
        name: linkID
        required: true
        type: string
      - description: Radio link data
        in: body
        name: radioLink
        required: true
        schema:
          $ref: '#/definitions/radiolink.RadioLinkData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/radiolink.RadioLink'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Update radio link
      tags:
      - radio-links
  /radio-links/import:
    post:
      consumes:
      - multipart/form-data
      description: Imports radio links from the first sheet of an .xlsx file. Invalid
        rows are reported individually.
      parameters:
      - description: Excel .xlsx file
        in: formData
        name: file
        required: true
        type: file
      - default: insert
        description: insert or upsert
        enum:
        - insert
        - upsert
        in: query
        name: mode
        type: string
      - default: false
        description: Validate without writing
        in: query
        name: dry_run
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/radiolink.ImportResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Import radio links from Excel
      tags:
      - radio-links
  /radio-links/import/jobs:
    post:
      consumes:
      - multipart/form-data
      description: Queues an asynchronous radio link import from an .xlsx file.
      parameters:
      - description: Excel .xlsx file
        in: formData
        name: file
        required: true
        type: file
      - default: insert
        description: insert or upsert
        enum:
        - insert
        - upsert
        in: query
        name: mode
        type: string
      - default: false
        description: Validate without writing
        in: query
        name: dry_run
        type: boolean
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/importjob.Job'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Create radio link import job
      tags:
      - import-jobs
  /stations:
    get:
      description: Returns a paginated list of stations.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: page_size
        type: integer
      - description: Search by site_id, end_id, station_id, city or address
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/station.Page'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: List stations
      tags:
      - stations
    post:
      consumes:
      - application/json
      description: Creates a station. The site_id must be unique.
      parameters:
      - description: Station data
        in: body
        name: station
        required: true
        schema:
          $ref: '#/definitions/station.StationData'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/station.Station'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Create station
      tags:
      - stations
  /stations/{siteID}:
    delete:
      description: Deletes a station by site_id.
      parameters:
      - description: Station site_id
        in: path
        name: siteID
        required: true
        type: string
      responses:
        "204":
          description: No content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Delete station
      tags:
      - stations
    get:
      description: Returns a station by site_id.
      parameters:
      - description: Station site_id
        in: path
        name: siteID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/station.Station'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get station
      tags:
      - stations
    put:
      consumes:
      - application/json
      description: Updates a station by site_id. The site_id cannot be changed.
      parameters:
      - description: Station site_id
        in: path
        name: siteID
        required: true
        type: string
      - description: Station data
        in: body
        name: station
        required: true
        schema:
          $ref: '#/definitions/station.StationData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/station.Station'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Update station
      tags:
      - stations
  /stations/import:
    post:
      consumes:
      - multipart/form-data
      description: Imports stations from the first sheet of an .xlsx file. Invalid
