        type: string
      city:
        example: TRES RANCHOS
        type: string
      contract_area_type:
        example: Compartilhado
        type: string
      created_at:
        example: "2026-10-24T12:00:00Z"
        type: string
      end_id:
        example: GOTSH_0001
        type: string
      ev_supplier:
        example: BRASILSAT
        type: string
      ev_type:
        example: TORRE METALICA TRIANGULAR
        type: string
      infrastructure_type:
        example: Greenfield
        type: string
      land_area:
        example: 10
        type: number
      latitude:
        example: -18.345528
        type: number
      longitude:
        example: -47.772028
        type: number
      neighborhood:
        example: ZONA RURAL
        type: string
      nominal_aev:
        example: "10"
        type: string
      observation:
        example: VENDIDO GENESIS - 1º CLOSING
        type: string
      regional:
        example: TCO
        type: string
      site_id:
        example: TSHG01
        type: string
      state:
        example: GO
        type: string
      station_id:
        example: TRH001TM
        type: string
      status:
        example: Aquisitado
        type: string
      structure_height:
        example: 50
        type: number
      technology:
        example: GSM
        type: string
      tower_type:
        example: TORRE METALICA TRIANGULAR
        type: string
      updated_at:
        example: "2026-10-24T12:00:00Z"
        type: string
      zip_code:
        example: "75720000"
        type: string
    type: object
  station.StationData:
    properties:
      address:
        example: FAZENDA MUNDO NOVO, S/N, ZONA RURAL, TRES RANCHOS
        type: string
      area_holder:
        example: AMERICAN TOWER
        type: string
      city:
        example: TRES RANCHOS
        type: string
      contract_area_type:
        example: Compartilhado
        type: string
      end_id:
        example: GOTSH_0001
        type: string
      ev_supplier:
        example: BRASILSAT
        type: string
      ev_type:
        example: TORRE METALICA TRIANGULAR
        type: string
      infrastructure_type:
        example: Greenfield
        type: string
      land_area:
        example: 10
        type: number
      latitude:
        example: -18.345528
        type: number
      longitude:
        example: -47.772028
        type: number
      neighborhood:
        example: ZONA RURAL
        type: string
      nominal_aev:
        example: "10"
        type: string
      observation:
        example: VENDIDO GENESIS - 1º CLOSING
        type: string
      regional:
        example: TCO
        type: string
      site_id:
        example: TSHG01
        type: string
      state:
        example: GO
        type: string
      station_id:
        example: TRH001TM
        type: string
      status:
        example: Aquisitado
        type: string
      structure_height:
        example: 50
        type: number
      technology:
        example: GSM
        type: string
      tower_type:
        example: TORRE METALICA TRIANGULAR
        type: string
      zip_code:
        example: "75720000"
        type: string
    type: object
  status.Database:
    properties:
      driver:
        example: mysql
        type: string
      error:
        example: database unreachable
        type: string
      latency_ms:
        example: 1.42
        type: number
      status:
        enum:
        - up
        - down
        example: up
        type: string
    type: object
  status.Report:
    properties:
      database:
        $ref: '#/definitions/status.Database'
      environment:
        example: development
        type: string
      service:
        example: api-stations-and-radio-link
        type: string
      status:
        enum:
        - ok
        - degraded
        example: ok
        type: string
      timestamp:
        example: "2026-10-24T12:00:00Z"
        type: string
      uptime:
        example: 1h2m3s
        type: string
      version:
