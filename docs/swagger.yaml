      parameters:
      - description: Excel .xlsx file
        in: formData
        name: file
        required: true
        type: file
      - default: insert
        description: insert or upsert
        enum:
        - insert
        - upsert
        in: query
        name: mode
        type: string
      - default: false
        description: Validate without writing
        in: query
        name: dry_run
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/station.ImportResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Import stations from Excel
      tags:
      - stations
  /stations/import/jobs:
    post:
      consumes:
      - multipart/form-data
      description: Queues an asynchronous station import from an .xlsx file.
      parameters:
      - description: Excel .xlsx file
        in: formData
