basePath: /api/v1
definitions:
  httpapi.ErrorResponse:
    properties:
      error:
        example: internal_server_error
        type: string
      message:
        example: unexpected internal error
        type: string
    type: object
  httpapi.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  station.Page:
    properties:
      items:
        items:
          $ref: '#/definitions/station.Station'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 1
        type: integer
      total_pages:
        example: 1
        type: integer
    type: object
  station.Station:
    properties:
      address:
        example: FAZENDA MUNDO NOVO, S/N, ZONA RURAL, TRES RANCHOS
        type: string
      area_holder:
