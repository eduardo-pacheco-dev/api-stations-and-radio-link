host: localhost:8080
info:
  contact: {}
  description: API for stations and radio link management.
  title: API Stations and Radio Link
  version: "1.0"
paths:
  /healthz:
    get:
      description: Returns 200 when the HTTP server is running, independently of database
        connectivity.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /stations:
    get:
      description: Returns a paginated list of stations.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: page_size
        type: integer
      - description: Search by site_id, end_id, station_id, city or address
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/station.Page'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: List stations
      tags:
      - stations
    post:
      consumes:
      - application/json
      description: Creates a station. The site_id must be unique.
      parameters:
      - description: Station data
        in: body
        name: station
        required: true
        schema:
          $ref: '#/definitions/station.StationData'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/station.Station'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Create station
      tags:
      - stations
  /stations/{siteID}:
    delete:
      description: Deletes a station by site_id.
      parameters:
      - description: Station site_id
        in: path
        name: siteID
        required: true
        type: string
      responses:
        "204":
          description: No content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Delete station
      tags:
      - stations
    get:
      description: Returns a station by site_id.
      parameters:
      - description: Station site_id
        in: path
        name: siteID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/station.Station'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get station
      tags:
      - stations
    put:
      consumes:
      - application/json
      description: Updates a station by site_id. The site_id cannot be changed.
      parameters:
      - description: Station site_id
        in: path
        name: siteID
        required: true
        type: string
      - description: Station data
        in: body
        name: station
        required: true
        schema:
          $ref: '#/definitions/station.StationData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/station.Station'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Update station
      tags:
      - stations
  /status:
    get:
      description: Returns the API status and verifies database connectivity.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/status.Report'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/status.Report'
      summary: API status
      tags:
      - status
schemes:
- http
- https
swagger: "2.0"
